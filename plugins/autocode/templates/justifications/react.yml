# React justification categories
# Categories are evaluated top to bottom; the first category whose pattern
# matches the file wins. Order more specific categories first.
#
# Ordering matters here: the component category's "*.tsx" glob is a superset
# of the test and hook globs, so spec_modification and hook are listed before
# component to ensure test files and hooks match their specific categories.
categories:
  # TypeScript base categories
  dependency:
    title: Dependency Change
    patterns:
      - "package.json"
      - "package-lock.json"
      - "yarn.lock"
      - "pnpm-lock.yaml"
    questions:
      - Why is this dependency needed?
      - What is the security and maintenance status of this package?
      - Are there lighter alternatives?
      - Does this require approval (e.g., license compatibility)?

  configuration:
    title: Configuration Change
    patterns:
      - "tsconfig.json"
      - "tsconfig.*.json"
      - ".eslintrc*"
      - ".prettierrc*"
      - "jest.config.*"
      - "vite.config.*"
      - "webpack.config.*"
      - ".env"
      - ".env.*"
    questions:
      - What behavior does this change?
      - Does this affect production builds?
      - Are secrets or credentials involved?
      - Is this environment-specific?

  security:
    title: Security-Sensitive File
    patterns:
      - "*auth*"
      - "*security*"
      - "*permission*"
      - "*credential*"
      - "*middleware*"
      - "*token*"
      - "*secret*"
    questions:
      - What security implications does this change have?
      - Have you verified this does not weaken access controls?
      - Does this need security review?

  spec_modification:
    title: Test/Spec Modification
    patterns:
      - "*.test.ts"
      - "*.test.tsx"
      - "*.spec.ts"
      - "*.spec.tsx"
      - "**/__tests__/**"
    questions:
      - Is this adding new tests for new or extracted code?
      - Is this refactoring test structure (no assertion changes)?
      - Is this updating test doubles or mocks for extracted collaborators?
      - Are you changing assertions to make a failing test pass? **(STOP IF YES)**

  # React-specific categories
  # hook is listed before component because "use*.tsx" files would otherwise
  # match the component category's broader "*.tsx" glob first.
  hook:
    title: React Hook
    patterns:
      - "*/hooks/*"
      - "use*.ts"
      - "use*.tsx"
    questions:
      - Does this hook follow the Rules of Hooks?
      - Are dependencies in useEffect/useMemo/useCallback correct?
      - Could this cause infinite render loops?

  component:
    title: React Component
    patterns:
      - "*.tsx"
      - "*.jsx"
      - "*/components/**"
    questions:
      - Does this component handle user input safely (XSS prevention)?
      - Is this component accessible (ARIA attributes, keyboard navigation)?
      - Does this affect rendering performance (unnecessary re-renders)?

  state:
    title: State Management
    patterns:
      - "*/store/*"
      - "*/stores/*"
      - "*/redux/*"
      - "*/context/*"
      - "*/providers/*"
    questions:
      - Does this change global application state shape?
      - Is state normalized correctly?
      - Could this cause unnecessary re-renders across the app?
