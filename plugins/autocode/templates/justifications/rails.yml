# Rails justification categories
# Categories are evaluated top to bottom; the first category whose pattern
# matches the file wins. Order more specific categories first.
categories:
  # Ruby base categories
  dependency:
    title: Dependency Change
    patterns:
      - "Gemfile"
      - "Gemfile.lock"
      - "*.gemspec"
    questions:
      - Why is this dependency needed?
      - What is the security and maintenance status of this gem?
      - Are there lighter alternatives?
      - Does this require approval (e.g., license compatibility)?

  configuration:
    title: Configuration Change
    patterns:
      - "*/config/*.yml"
      - "*/config/*.yaml"
      - "*/config/*.rb"
      - ".env"
      - ".env.*"
    questions:
      - What behavior does this change?
      - Does this affect production?
      - Are secrets or credentials involved?
      - Is this environment-specific?

  security:
    title: Security-Sensitive File
    patterns:
      - "*auth*"
      - "*security*"
      - "*permission*"
      - "*credential*"
      - "*policy*"
      - "*secret*"
      - "*token*"
    questions:
      - What security implications does this change have?
      - Have you verified this does not weaken access controls?
      - Does this need security review?

  spec_modification:
    title: Test/Spec Modification
    patterns:
      - "*_spec.rb"
      - "*_test.rb"
      - "spec/**/*.rb"
      - "test/**/*.rb"
      - "spec_helper.rb"
    questions:
      - Is this adding new specs for new or extracted code?
      - Is this refactoring spec structure (no assertion changes)?
      - Is this updating test doubles or mocks for extracted collaborators?
      - Are you changing assertions to make a failing test pass? **(STOP IF YES)**

  # Rails-specific categories
  migration:
    title: Database Migration
    patterns:
      - "*/db/migrate/*"
      - "db/migrate/*"
    questions:
      - Is this a new migration?
      - Is this editing an unmigrated migration?
      - Is this editing a deployed migration? **(CREATE NEW MIGRATION INSTEAD)**
      - Is this migration reversible?
      - Could this migration cause downtime on large tables?

  schema:
    title: Schema Dump Change
    patterns:
      - "db/schema.rb"
      - "db/structure.sql"
      - "*/db/schema.rb"
      - "*/db/structure.sql"
    questions:
      - Was this dump regenerated by running migrations (not hand-edited)? **(NEVER HAND-EDIT)**
      - Does the diff match the accompanying migration(s)?
      - Are there unrelated changes leaking in from a stale local database?

  routes:
    title: Route Change
    patterns:
      - "*/config/routes.rb"
      - "*/config/routes/*.rb"
      - "config/routes.rb"
      - "config/routes/*.rb"
    questions:
      - Does this change any existing routes?
      - Could this break existing API consumers or bookmarks?
      - Are route constraints and authentication configured correctly?

  initializer:
    title: Initializer Change
    patterns:
      - "*/config/initializers/*.rb"
      - "config/initializers/*.rb"
    questions:
      - Does this initializer affect application boot time?
      - Is this configuration environment-specific?
      - Could this cause issues during deployment (e.g., missing ENV vars)?
