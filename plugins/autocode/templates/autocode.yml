# Autocode Configuration
# Copy this file to .claude/autocode.yml and customize for your project
# yq is optional; used when present for more robust config parsing, awk fallback otherwise

# Model selection (optional)
# ceiling caps dynamic model selection (planning, coding, code review).
# It does NOT affect roles with fixed frontmatter models, so lowering it
# for cost control cannot starve the tester or other fixed roles.
# Allowed values: opus (default) or fable. Anything else is treated as
# opus with a warning. See the plugin's docs/MODEL_SELECTION.md for the
# full decision tables.
models:
  ceiling: opus        # opus (default) or fable

# Static analysis configuration (optional)
# Customize what static analysis is run during TDD loop
static_analysis:
  enabled: true                   # Master switch (default: true)
  # Commands to run during the analysis step. The examples below cover a
  # mixed Ruby/JavaScript project; uncomment only the ones your project
  # actually uses, otherwise a fresh project inherits failing linters.
  commands: []
  # commands:
  #   - rubocop                   # Simple string form
  #   - npm run lint
  #   - command: eslint --format json src/
  #     format: json              # auto, json, text (default: auto)
  #   - command: reek -c .reek.yml --format json
  #     format: json
  #   - npm run typecheck
  fail_on_warnings: false         # Block on warnings (default: false)
  max_fix_attempts: 2             # Max fix attempts per issue (default: 2)
  # Per-edit quality gate: a PostToolUse hook runs a per-file check
  # against each file Claude writes or edits, and feeds failures back
  # immediately (exit 2). The full-project pass still runs via the
  # analyzer agent. Disable if your linter is slow.
  on_edit:
    enabled: true                 # Toggle for the per-edit hook (default: true)
    command: ""                   # Per-file command; the edited file path is
                                  # appended (e.g. "npx eslint" or "rubocop").
                                  # When empty, the first simple string under
                                  # `commands:` above is used instead.

# Artifact judge (optional, default OFF)
# After a task-runner completes a task, a read-only Agent SDK call
# (allowedTools: Read, Glob) judges whether the task's artifact files
# are substantive or template stubs, and emits a structured warning for
# stubs. Costs tokens and requires node with @anthropic-ai/claude-agent-sdk.
# Every failure mode (missing SDK, missing credentials, timeout,
# unparseable verdict) degrades to a pass and is logged to
# hook-errors.jsonl rather than failing silently.
artifact_judge:
  enabled: false
  # model: claude-haiku-4-5-20251001   # Model used for the judge call
                                        # (default: claude-haiku-4-5-20251001,
                                        # kept cheap since this runs on every
                                        # task-runner completion)

# PR template (optional)
# Path (relative to the project root) to a custom PR description template
# used by /autocode:sync-pr instead of the shipped default. Takes priority
# over the conventional .claude/templates/pr_description.md location.
pr_template_path: .github/PULL_REQUEST_TEMPLATE.md

# Code review configuration (optional)
# /autocode:code-review resolves its checklist in priority order:
#   1. code_review.checklist below
#   2. .claude/code-review-checklist.md in the project
#   3. The plugin default at skills/code-review/code-review-checklist.md
#
# code_review.model is an explicit override (M4 in docs/MODEL_SELECTION.md) of
# the review model. When unset (the default), the code-review skill picks the
# reviewer tier per diff from the R table: opus for escalations/failures,
# security-sensitive paths, or large diffs; sonnet for small clean diffs.
# Setting it replaces the table result for every review (still capped by
# models.ceiling above).
# code_review:
#   checklist: .claude/my-review-checklist.md   # Path to a custom checklist file
#   model: opus                                  # Override the R-table reviewer tier (default: unset)

# Justification configuration (optional)
# Customize when and how justifications are required for file modifications
#
# The category defaults below are Rails-flavored (Gemfile, db/migrate, *_spec.rb).
# Framework-specific templates for other stacks live in the plugin at
# templates/justifications/ (ruby, rails, python, django, typescript, react, go);
# install one with `/autocode:init --justifications <template>`.
#
# Precedence:
#   - If `.claude/justifications.yml` exists in the project, its top-level
#     `categories:` replaces `justification.categories` defined here.
#   - Within a file, categories are evaluated in order and the first category
#     whose pattern matches the file wins.
justification:
  # Custom categories for file pattern matching
  # Each category defines patterns (glob) and prompting questions
  categories:
    spec_modification:
      title: "Test/Spec Modification"
      patterns:
        - "*_spec.rb"
        - "*_test.rb"
      questions:
        - "Is this adding new specs for extracted code?"
        - "Is this refactoring spec structure (no assertion changes)?"
        - "Is this updating test doubles for extracted collaborators?"
        - "Is this removing specs for deleted code?"
        - "Is this fixing specs that tested implementation details?"
        - "Are you changing assertions to make a failing test pass? **(STOP IF YES)**"

    migration:
      title: "Database Migration"
      patterns:
        - "*/db/migrate/*"
        - "*/migrations/*"
      questions:
        - "Is this a new migration?"
        - "Is this editing an unmigrated migration?"
        - "Is this editing a deployed migration? **(CREATE NEW MIGRATION INSTEAD)**"

    dependency:
      title: "Dependency Change"
      patterns:
        - "Gemfile"
        - "Gemfile.lock"
      questions:
        - "Why is this dependency needed?"
        - "What is the security/maintenance status?"
        - "Are there lighter alternatives?"
        - "Does this require approval (e.g., enterprise requirements)?"

    configuration:
      title: "Configuration Change"
      patterns:
        - "*/config/*.yml"
        - "*/config/*.yaml"
      questions:
        - "What behavior does this change?"
        - "Does this affect production?"
        - "Are secrets or credentials involved?"
        - "Is this environment-specific?"

    security:
      title: "Security-Sensitive File"
      patterns:
        - "*auth*"
        - "*security*"
        - "*permission*"
        - "*policy*"
        - "*credential*"
      questions:
        - "What security implications does this change have?"
        - "Have you verified this doesn't weaken access controls?"
        - "Does this need security review?"

    # Example custom category - uncomment and modify as needed
    # infrastructure:
    #   title: "Infrastructure Change"
    #   patterns:
    #     - "terraform/**"
    #     - "*.tf"
    #     - "k8s/**"
    #     - "*.yaml"  # Be specific to avoid matching all YAML
    #   questions:
    #     - "Has platform team reviewed?"
    #     - "Is this change reversible?"
    #     - "What environments are affected?"

  # Default behavior for files that don't match any category
  default:
    title: "File Modification"
    questions:
      - "What is the purpose of this change?"
      - "Does this change affect other parts of the codebase?"
      - "Is this change reversible?"
