name: autoskill CI

on:
  push:
    branches: [main]
    paths:
      - "plugins/autoskill/**"
      - ".github/workflows/autoskill-ci.yml"
  pull_request:
    paths:
      - "plugins/autoskill/**"
      - ".github/workflows/autoskill-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify shellcheck and jq are available
        run: |
          shellcheck --version
          jq --version

      - name: Run plugin test suite
        run: make -C plugins/autoskill test
