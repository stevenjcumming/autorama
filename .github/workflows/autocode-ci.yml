name: autocode CI

on:
  push:
    branches: [main]
    paths:
      - "plugins/autocode/**"
      - ".github/workflows/autocode-ci.yml"
  pull_request:
    paths:
      - "plugins/autocode/**"
      - ".github/workflows/autocode-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyYAML (for YAML lint step)
        run: python3 -m pip install --quiet pyyaml

      - name: Install bats
        uses: bats-core/bats-action@3.0.1

      - name: Verify shellcheck and jq are available
        run: |
          shellcheck --version
          jq --version

      - name: Run plugin test suite
        run: make -C plugins/autocode test
